# CI — runs on every pull request and on every push to main/develop.
#
# Three independent jobs (not three steps in one job) on purpose: a
# failing guardrail regression test (job "Safety Guardrails") needs to be
# visually distinct in the PR checks list from a regular lint/typecheck/
# test failure (job "Lint, Typecheck & Test") or a broken Docker build
# (job "Docker Build") — see CLAUDE.md Sec 6, the guardrail suite is "the
# one part of the system where 'helpful' must lose to 'safe'", so its
# pass/fail status shouldn't be buried inside a bigger job's log. Within
# each job, steps fail fast (a failing step stops the rest of that job by
# default) — no special config needed for that.
#
# Node/pnpm versions come from package.json's own "engines"/"packageManager"
# fields, not hardcoded here, so this file doesn't drift from that source
# of truth.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancel an in-progress run for the same PR/branch when a new commit lands
# — no point finishing a CI run for a commit that's already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint, typecheck, and the full test suite (including coverage) — the
  # guardrail regression suite (src/e2e/guardrails.e2e.test.ts) is part of
  # this run too (via `pnpm test:coverage`, which runs every *.test.ts),
  # but its pass/fail status is *also* reported independently by the
  # "Safety Guardrails" job below, per this workflow's own header comment.
  # ---------------------------------------------------------------------------
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No explicit version — reads package.json's "packageManager"
        # field (pnpm@9.12.0), so this workflow can't silently drift from
        # what CLAUDE.md/package.json declare as the pinned version.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # package.json's engines.node is ">=20.0.0" — 20 is the floor
          # and the current Node LTS, so it's what CI pins to.
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage report
        # `if: always()` so this still runs (and uploads whatever coverage
        # vitest managed to emit) even if the test step above failed
        # assertions — useful for debugging a red PR. If lint/typecheck
        # failed earlier and coverage/ was never generated at all,
        # `if-no-files-found: warn` below just logs a warning instead of
        # failing this step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Safety Guardrails — Phase 3.2/7.1's guardrail regression suite
  # (src/e2e/guardrails.e2e.test.ts, HLD Sec 16), run as its own job so a
  # regression in the forbidden-action/escalation-trigger boundaries shows
  # up as its own red/green check on the PR, not buried inside the
  # broader test job's log. See docs/test-coverage.md for what this suite
  # covers.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Safety Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guardrail regression suite
        run: pnpm test:guardrails

  # ---------------------------------------------------------------------------
  # Docker Build — confirms docker/Dockerfile still builds cleanly against
  # the current source (no push; this is a build-correctness check, not a
  # release — image publishing is scripts/gcp/setup-cicd.sh's/a future
  # deploy workflow's job). Uses the same multi-stage Dockerfile
  # docker-compose.yml builds locally and CI would push from in a later
  # phase.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # Layer caching keyed off this repo's GitHub Actions cache —
          # speeds up repeat CI builds without needing a registry.
          cache-from: type=gha
          cache-to: type=gha,mode=max
