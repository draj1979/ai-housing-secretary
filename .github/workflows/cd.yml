# CD — builds and pushes the Docker image to Artifact Registry after CI
# passes, then rolls it out. Two parallel tracks, same file:
#
#   push to main    -> build-and-push-production (no environment gate)
#                      -> deploy-production (environment: production,
#                         required reviewer) -> openclaw1
#   push to develop -> build-and-push-staging (no environment gate)
#                      -> deploy-staging (environment: staging, no
#                         required reviewer — this IS the "verify before
#                         production approval" step) ->
#                         ai-housing-secretary-staging
#
# Only the *deploy* job in each track carries the `environment:` key —
# build/push jobs don't need reviewer approval (they only push to
# Artifact Registry, nothing production-facing); deploy-production/
# deploy-staging (the jobs that actually SSH into a VM) still gate on it.
#
# Triggered by a plain `push:` to main/develop, not `workflow_run`
# watching CI (.github/workflows/ci.yml) — this repo's branch protection
# already requires CI to pass before a merge can land on either branch,
# so a direct `push:` trigger doesn't skip that check, just avoids an
# extra layer of indirection.
#
# No GCP service account key anywhere in this file. Auth is a **hybrid**
# of two WIF flows, split by what each job actually needs to do —
# deliberately, after live-testing both ends of this:
#
#   - build-and-push-* — **Direct** WIF, no impersonation.
#     `google-github-actions/auth` exchanges GitHub's OIDC token for
#     short-lived GCP credentials representing the run's own federated
#     identity directly. `roles/artifactregistry.writer` on the one
#     Artifact Registry repo is granted straight to that identity — a
#     `principalSet` scoped to `attribute.repository` (this repo only;
#     see the pool provider's own `attributeCondition`), covering every
#     ref/environment with no exact subject-string match needed. Confirmed
#     working live.
#   - deploy-* — impersonates `github-deployer@` (`service_account:` +
#     `roles/iam.workloadIdentityUser`). Direct WIF does *not* work here:
#     `gcloud compute ssh`/`scp` (OS Login) rejects raw federated
#     credentials outright — confirmed live with `INVALID_ARGUMENT:
#     Workload identities are not supported.` — so these two jobs need an
#     impersonated *real* identity instead. This is narrower than an
#     earlier, abandoned attempt to impersonate github-deployer@ with
#     `token_format: access_token` for the build/push jobs, which failed
#     every single time (`iam.serviceAccounts.getAccessToken` denied, no
#     explanation available from GCP's IAM Policy Troubleshooter — doesn't
#     support evaluating WIF principals — or Cloud Logging, Data Access
#     audit logs for that call aren't on by default): no `token_format`
#     here, so `google-github-actions/auth` just writes an ADC file
#     describing the impersonation, and `gcloud` calls
#     `generateAccessToken` itself, lazily, only when it actually needs a
#     token — which works, unlike the eager upfront call `token_format:
#     access_token` makes. `github-deployer@` also needs
#     `roles/compute.osAdminLogin` + `roles/iap.tunnelResourceAccessor`
#     (scoped to each target VM) and `roles/compute.viewer`
#     (project-level — `gcloud compute ssh`/`scp` needs
#     `compute.projects.get` before it can even attempt the IAP tunnel).
#
# GCE_VM_NAME/GCE_VM_ZONE are deliberately *not* repo-level variables —
# they're set per-Environment (Settings -> Environments -> production /
# staging -> Variables), so the exact same `${{ vars.GCE_VM_NAME }}`
# expression below resolves to openclaw1 in the production jobs and
# ai-housing-secretary-staging in the staging jobs, with zero
# duplication of step logic between the two tracks. GCP_PROJECT_ID/
# ARTIFACT_REGISTRY_REGION stay repo-level — same project/region either
# way.
#
# What each track's two jobs do (identical shape on both sides):
#   1. build-and-push-* — builds docker/Dockerfile, tags the short git
#      SHA of the exact commit CI tested (prefixed `staging-` on the
#      staging track, to keep it visually distinct from production tags
#      in the shared Artifact Registry repo; production also tags
#      `latest`, staging does not — docker-compose.yml's own `latest`
#      default is meant to mean "production", not "whatever's newest
#      anywhere"), pushes to Artifact Registry.
#   2. deploy-* — SSHes into the target VM (IAP tunnel, OS Login, no
#      static keys) and runs scripts/gcp/remote-deploy.sh with the new
#      tag. If remote-deploy.sh's own healthcheck fails, reads the VM's
#      `.last-good-tag` file and re-invokes remote-deploy.sh with *that*
#      tag as an automatic rollback — then still fails the workflow
#      regardless of whether the rollback itself succeeded, so a bad
#      deploy is always visible, never silently absorbed.
#
# One-time manual setup this file cannot do for you: creating the
# "production"/"staging" Environments themselves (Settings ->
# Environments), production's required reviewer, and each Environment's
# GCE_VM_NAME/GCE_VM_ZONE variables — see docs/deployment.md's "CI/CD
# Auth" section for the exact steps (or the `gh api` equivalent) if
# either isn't already configured. Every job also needs
# `gcloud compute ssh --tunnel-through-iap` to actually reach its VM —
# scripts/provision-gcp.sh's printed setup notes cover enabling IAP TCP
# forwarding / the allow-ssh-iap firewall rule if that's not already in
# place.
name: CD

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  # Required for google-github-actions/auth to mint a Workload Identity
  # Federation token — nothing else in this workflow needs elevated
  # permissions.
  id-token: write

jobs:
  # ===========================================================================
  # Production track (push to main)
  # ===========================================================================

  build-and-push-production:
    name: 'Build & Push Image (production)'
    runs-on: ubuntu-latest
    # `push:` fires this whole workflow for both main and develop —
    # each job picks its own branch here (only one of
    # build-and-push-production/-staging ever actually runs per push).
    if: github.ref == 'refs/heads/main'

    # Never cancel an in-progress production deploy for a newer push —
    # queue instead, so two overlapping runs can't push half-finished/
    # out-of-order image tags. Separate concurrency group from staging's
    # below, so a staging deploy never waits on a production one or vice
    # versa — the two targets are independent.
    concurrency:
      group: cd-production
      cancel-in-progress: false

    # No `environment:` gate here on purpose — this job only pushes an
    # image to Artifact Registry, nothing production-facing, so it
    # doesn't need reviewer approval (deploy-production below, the job
    # that actually touches the VM, still has one).
    steps:
      # Check out the exact commit CI tested and passed — not whatever
      # main happens to point at right now (which could have moved if
      # another push landed while this run was queued/waiting on
      # approval). This is the one correctness-critical use of
      # `head_sha` in this file; every tag below derives from it too.
      - name: Checkout (commit CI actually tested)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute short SHA
        id: sha
        run: |
          FULL_SHA="${{ github.sha }}"
          echo "short=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Direct WIF — writes an ADC credentials file backed by this run's
      # own federated identity (no service-account impersonation — see
      # this file's header comment), authorized for whatever's granted
      # directly to the `attribute.repository` principalSet
      # (artifactregistry.writer on this one repo, nothing project-wide).
      # No `token_format:` here on purpose — google-github-actions/auth's
      # `token_format: access_token` output unconditionally requires
      # impersonating a `service_account:` (it errors without one, even
      # under Direct WIF), so instead the next two steps mint an access
      # token straight from this ADC file via `gcloud auth
      # print-access-token` — that call itself needs no impersonation,
      # since it's just exchanging the federated credential already on
      # disk for an OAuth token representing the *same* identity.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Mint an access token for Docker login
        id: auth
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          # Unlike google-github-actions/auth's own access_token output
          # (auto-masked by that action), a manually-minted token isn't
          # masked in logs unless registered explicitly.
          echo "::add-mask::${TOKEN}"
          echo "access_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      # Registry login uses the access token above directly — no
      # `gcloud auth configure-docker` needed.
      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Image path matches docker/docker-compose.yml's `image:` fields
      # exactly (${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO_NAME}/app)
      # so scripts/gcp/remote-deploy.sh's `docker compose pull` — with
      # IMAGE_TAG set to this run's short SHA — finds exactly what this
      # step pushed. AR_REPO_NAME defaults to "ai-housing-secretary",
      # matching scripts/gcp/setup-cicd.sh's own AR_REPO_NAME default;
      # override via a repo variable of the same name if that was ever
      # changed at provisioning time.
      - name: 'Build and push (tags: latest + short SHA)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_NAME || 'ai-housing-secretary' }}/app:latest
            ${{ vars.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_NAME || 'ai-housing-secretary' }}/app:${{ steps.sha.outputs.short }}
          # Reuses ci.yml's Docker Build job's GitHub Actions cache layer
          # (same context/Dockerfile, cache-to: gha,mode=max there) —
          # this push is usually near-instant on top of it rather than a
          # cold rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to VM (production)
    needs: build-and-push-production
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
      # Read-only access to this run's own deployment-approval records
      # (Get deployment approver step below) — nothing else in this job
      # needs elevated GITHUB_TOKEN permissions beyond the workflow's own
      # contents/id-token defaults.
      actions: read
    env:
      # Must match scripts/provision-gcp.sh's DEPLOY_BASE_DIR default —
      # not one of scripts/gcp/setup-cicd.sh's printed repo variables, so
      # it isn't parameterized via `vars.*` here; update this literal if
      # that default is ever changed at provisioning time.
      DEPLOY_BASE_DIR: /opt/ai-housing-secretary

    steps:
      # Only needed so the files below (docker-compose.yml,
      # nginx.conf.template, remote-deploy.sh) exist locally to scp up —
      # this job never checks out the full repo onto the VM itself (see
      # docker/docker-compose.yml's own header comment on why: images
      # come from Artifact Registry, not a local build).
      - name: Checkout (commit CI actually tested)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute short SHA
        id: sha
        run: |
          FULL_SHA="${{ github.sha }}"
          echo "short=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Impersonates github-deployer@ here — unlike the build/push jobs
      # above, this one is NOT Direct WIF: `gcloud compute ssh`/`scp`
      # (OS Login) categorically rejects raw workload-identity-federation
      # credentials ("INVALID_ARGUMENT: Workload identities are not
      # supported", confirmed live), so SSH-based deploy jobs specifically
      # need a real identity — an impersonated service account satisfies
      # that where a direct federated credential can't. This is a
      # narrower, working case of the impersonation flow that broke for
      # `token_format: access_token` elsewhere in this file: no
      # `token_format` here, so `google-github-actions/auth` just writes
      # an ADC file describing the impersonation, and `gcloud`
      # lazily/transparently calls `generateAccessToken` itself only when
      # it actually needs a token — which succeeds, unlike the eager
      # upfront call `token_format: access_token` makes.
      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # gcloud CLI, wired to the WIF credentials the auth step above just
      # minted — `gcloud compute ssh`/`scp` below need the CLI itself,
      # not just an ADC credentials file.
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # `gcloud compute ssh`/`scp --tunnel-through-iap` is the same
      # OS Login + IAP mechanism scripts/provision-gcp.sh (enables OS
      # Login) sets up — `roles/compute.osAdminLogin` +
      # `roles/iap.tunnelResourceAccessor`, scoped to this one instance,
      # granted to `github-deployer@` (see this file's header comment for
      # why this job impersonates a service account rather than using
      # Direct WIF like the build/push jobs) — no SSH key pair to manage,
      # gcloud generates and registers an ephemeral one per run via the
      # OS Login API. `--quiet` suppresses interactive prompts (safe to
      # always answer yes non-interactively here — there's nothing to
      # confirm beyond "generate a throwaway key").
      #
      # DEPLOY_BASE_DIR is root-owned 0755 (scripts/provision-gcp.sh), so
      # these can't scp directly into it — copy to the login user's home
      # first, then move into place with sudo over a second SSH call.
      #
      # docker-compose.yml + nginx.conf.template land under
      # DEPLOY_BASE_DIR/docker/ (not DEPLOY_BASE_DIR itself) — load-
      # bearing, not cosmetic: docker-compose.yml's own `env_file:
      # ../.env` only resolves to DEPLOY_BASE_DIR/.env if the compose
      # file is one directory below it. See
      # scripts/gcp/remote-deploy.sh's header comment for the same note
      # from the other side of this handoff. `install -D` creates
      # DEPLOY_BASE_DIR/docker/ on first run if it doesn't exist yet.
      - name: Sync docker-compose.yml + nginx.conf.template + remote-deploy.sh to the VM
        run: |
          set -euo pipefail
          COMMON_FLAGS=(--zone="${{ vars.GCE_VM_ZONE }}" --project="${{ vars.GCP_PROJECT_ID }}" --tunnel-through-iap --quiet)

          gcloud compute scp "${COMMON_FLAGS[@]}" \
            docker/docker-compose.yml "${{ vars.GCE_VM_NAME }}:~/docker-compose.yml.new"
          gcloud compute scp "${COMMON_FLAGS[@]}" \
            docker/nginx.conf.template "${{ vars.GCE_VM_NAME }}:~/nginx.conf.template.new"
          gcloud compute scp "${COMMON_FLAGS[@]}" \
            scripts/gcp/remote-deploy.sh "${{ vars.GCE_VM_NAME }}:~/remote-deploy.sh.new"

          gcloud compute ssh "${{ vars.GCE_VM_NAME }}" "${COMMON_FLAGS[@]}" --command="
            sudo install -D -o root -g root -m 0644 ~/docker-compose.yml.new ${DEPLOY_BASE_DIR}/docker/docker-compose.yml &&
            sudo install -D -o root -g root -m 0644 ~/nginx.conf.template.new ${DEPLOY_BASE_DIR}/docker/nginx.conf.template &&
            sudo install -o root -g root -m 0755 ~/remote-deploy.sh.new ${DEPLOY_BASE_DIR}/remote-deploy.sh &&
            rm -f ~/docker-compose.yml.new ~/nginx.conf.template.new ~/remote-deploy.sh.new
          "

      # The core of this job. Not `set -e`: a failed deploy is an
      # expected, handled outcome here (triggers the rollback branch
      # below), not a script bug — using the exit code explicitly is
      # clearer than trying to make `set -e` cooperate with that.
      #
      # remote-deploy.sh's own stdout/stderr streams straight into this
      # step's log via `gcloud compute ssh --command` (nothing redirected
      # or swallowed) — that's what satisfies "capture the remote
      # script's output in the workflow logs". Its own secret-refresh
      # step never prints a value either — see that script's own
      # comments and docs/deployment.md's "Secret flow" section.
      - name: Deploy (with automatic rollback on healthcheck failure)
        id: deploy
        env:
          NEW_TAG: ${{ steps.sha.outputs.short }}
        run: |
          set -uo pipefail

          ssh_run() {
            gcloud compute ssh "${{ vars.GCE_VM_NAME }}" \
              --zone="${{ vars.GCE_VM_ZONE }}" --project="${{ vars.GCP_PROJECT_ID }}" \
              --tunnel-through-iap --quiet --command="$1"
          }

          echo "::group::Deploying ${NEW_TAG}"
          ssh_run "${DEPLOY_BASE_DIR}/remote-deploy.sh ${NEW_TAG}"
          DEPLOY_STATUS=$?
          echo "::endgroup::"

          if [[ "${DEPLOY_STATUS}" -eq 0 ]]; then
            echo "Deploy of ${NEW_TAG} succeeded."
            exit 0
          fi

          echo "::error::Deploy of ${NEW_TAG} failed (remote-deploy.sh exited ${DEPLOY_STATUS}) — attempting automatic rollback"

          PREV_TAG="$(ssh_run "cat ${DEPLOY_BASE_DIR}/.last-good-tag 2>/dev/null || true" | tr -d '[:space:]')"

          if [[ -z "${PREV_TAG}" ]]; then
            echo "::error::No .last-good-tag recorded on the VM (this may be the first-ever deploy) — nothing to roll back to. VM is left on the failed ${NEW_TAG} deploy; investigate manually."
            exit 1
          fi

          echo "::group::Rolling back to ${PREV_TAG}"
          ssh_run "${DEPLOY_BASE_DIR}/remote-deploy.sh ${PREV_TAG}"
          ROLLBACK_STATUS=$?
          echo "::endgroup::"

          if [[ "${ROLLBACK_STATUS}" -eq 0 ]]; then
            echo "::error::Deploy of ${NEW_TAG} failed; automatically rolled back to previous known-good tag ${PREV_TAG} successfully. Failing this workflow so the bad deploy is still visible."
          else
            echo "::error::Deploy of ${NEW_TAG} failed AND rollback to ${PREV_TAG} also failed (exit ${ROLLBACK_STATUS}) — VM may be in a broken state, investigate manually."
          fi
          # Always non-zero past this point: per this task's own
          # requirement, a failed deploy fails the workflow regardless of
          # whether the automatic rollback itself succeeded.
          exit 1

      # Runs only if the step above exited 0 (default Actions behavior —
      # a failed step skips subsequent steps unless they opt into
      # `if: always()`, which this deliberately does not).
      - name: Get deployment approver
        id: approver
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPROVER="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" --jq '.[0].user.login // empty' 2>/dev/null || true)"
          if [[ -z "${APPROVER}" ]]; then
            # Falls back to whoever triggered the underlying CI run if the
            # approvals API returns nothing (e.g. the environment's
            # required-reviewers rule was reconfigured mid-flight) —
            # still a reasonable "who's responsible for this" answer.
            APPROVER="${{ github.triggering_actor }}"
          fi
          echo "login=${APPROVER}" >> "$GITHUB_OUTPUT"

      - name: Write deploy summary
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TAG: ${{ steps.sha.outputs.short }}
          APPROVER: ${{ steps.approver.outputs.login }}
        run: |
          # COMMIT_MESSAGE can be multi-line and contain `|` — passed via
          # env (not interpolated straight into this script) specifically
          # so it can't break the shell here, then sanitized for a
          # markdown table cell (first line only, pipes escaped).
          COMMIT_SUBJECT="$(printf '%s' "${COMMIT_MESSAGE}" | head -n1 | sed 's/|/\\|/g')"
          {
            echo "## 🚀 Deployed to production"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`${COMMIT_SHA:0:7}\`](${COMMIT_URL}) — ${COMMIT_SUBJECT} |"
            echo "| Image tag | \`${TAG}\` |"
            echo "| Time (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| Approved by | @${APPROVER} |"
            echo "| VM | \`${{ vars.GCE_VM_NAME }}\` (\`${{ vars.GCE_VM_ZONE }}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Staging track (push to develop) — same shape as the production jobs
  # above, deliberately kept structurally identical rather than factored
  # into a reusable workflow, so a diff between the two tracks is a diff
  # between two readable job blocks, not an indirection through inputs.
  # Key differences, called out where they occur: no required-reviewer
  # gate (this track *is* the pre-approval verification step), tags
  # prefixed `staging-` and no floating `latest`, targets the
  # `staging` Environment's own GCE_VM_NAME/GCE_VM_ZONE.
  # ===========================================================================

  build-and-push-staging:
    name: 'Build & Push Image (staging)'
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    concurrency:
      group: cd-staging
      cancel-in-progress: false

    # No `environment:` gate here, same reasoning as
    # build-and-push-production above — this job only pushes an image to
    # Artifact Registry (nothing staging-VM-facing). deploy-staging below
    # still carries one, though staging's was never a required-reviewer
    # gate (see that job).
    steps:
      - name: Checkout (commit CI actually tested)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute short SHA
        id: sha
        run: |
          FULL_SHA="${{ github.sha }}"
          echo "short=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # See build-and-push-production's identical steps for why this is
      # split into auth (no token_format) + setup-gcloud + print-access-token
      # rather than a single `token_format: access_token` auth step.
      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Mint an access token for Docker login
        id: auth
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          # Unlike google-github-actions/auth's own access_token output
          # (auto-masked by that action), a manually-minted token isn't
          # masked in logs unless registered explicitly.
          echo "::add-mask::${TOKEN}"
          echo "access_token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `staging-<sha>` only, deliberately no `latest` push — see this
      # section's own header comment for why.
      - name: 'Build and push (tag: staging-<short SHA>)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ vars.ARTIFACT_REGISTRY_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO_NAME || 'ai-housing-secretary' }}/app:staging-${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to VM (staging)
    needs: build-and-push-staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      DEPLOY_BASE_DIR: /opt/ai-housing-secretary

    steps:
      - name: Checkout (commit CI actually tested)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Compute short SHA
        id: sha
        run: |
          FULL_SHA="${{ github.sha }}"
          echo "short=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # See deploy-production's identical step for why this impersonates
      # github-deployer@ rather than using Direct WIF like the build/push
      # jobs — OS Login rejects raw federated credentials outright.
      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync docker-compose.yml + nginx.conf.template + remote-deploy.sh to the VM
        run: |
          set -euo pipefail
          COMMON_FLAGS=(--zone="${{ vars.GCE_VM_ZONE }}" --project="${{ vars.GCP_PROJECT_ID }}" --tunnel-through-iap --quiet)

          gcloud compute scp "${COMMON_FLAGS[@]}" \
            docker/docker-compose.yml "${{ vars.GCE_VM_NAME }}:~/docker-compose.yml.new"
          gcloud compute scp "${COMMON_FLAGS[@]}" \
            docker/nginx.conf.template "${{ vars.GCE_VM_NAME }}:~/nginx.conf.template.new"
          gcloud compute scp "${COMMON_FLAGS[@]}" \
            scripts/gcp/remote-deploy.sh "${{ vars.GCE_VM_NAME }}:~/remote-deploy.sh.new"

          gcloud compute ssh "${{ vars.GCE_VM_NAME }}" "${COMMON_FLAGS[@]}" --command="
            sudo install -D -o root -g root -m 0644 ~/docker-compose.yml.new ${DEPLOY_BASE_DIR}/docker/docker-compose.yml &&
            sudo install -D -o root -g root -m 0644 ~/nginx.conf.template.new ${DEPLOY_BASE_DIR}/docker/nginx.conf.template &&
            sudo install -o root -g root -m 0755 ~/remote-deploy.sh.new ${DEPLOY_BASE_DIR}/remote-deploy.sh &&
            rm -f ~/docker-compose.yml.new ~/nginx.conf.template.new ~/remote-deploy.sh.new
          "

      # Same automatic-rollback design as deploy-production — see that
      # job's identical step for the full commentary. IMAGE_TAG here is
      # the `staging-<sha>` tag build-and-push-staging just pushed, and
      # this VM's own .last-good-tag is entirely separate from
      # production's (different VM, different file).
      - name: Deploy (with automatic rollback on healthcheck failure)
        id: deploy
        env:
          NEW_TAG: staging-${{ steps.sha.outputs.short }}
        run: |
          set -uo pipefail

          ssh_run() {
            gcloud compute ssh "${{ vars.GCE_VM_NAME }}" \
              --zone="${{ vars.GCE_VM_ZONE }}" --project="${{ vars.GCP_PROJECT_ID }}" \
              --tunnel-through-iap --quiet --command="$1"
          }

          echo "::group::Deploying ${NEW_TAG}"
          ssh_run "${DEPLOY_BASE_DIR}/remote-deploy.sh ${NEW_TAG}"
          DEPLOY_STATUS=$?
          echo "::endgroup::"

          if [[ "${DEPLOY_STATUS}" -eq 0 ]]; then
            echo "Deploy of ${NEW_TAG} succeeded."
            exit 0
          fi

          echo "::error::Deploy of ${NEW_TAG} failed (remote-deploy.sh exited ${DEPLOY_STATUS}) — attempting automatic rollback"

          PREV_TAG="$(ssh_run "cat ${DEPLOY_BASE_DIR}/.last-good-tag 2>/dev/null || true" | tr -d '[:space:]')"

          if [[ -z "${PREV_TAG}" ]]; then
            echo "::error::No .last-good-tag recorded on the VM (this may be the first-ever deploy) — nothing to roll back to. VM is left on the failed ${NEW_TAG} deploy; investigate manually."
            exit 1
          fi

          echo "::group::Rolling back to ${PREV_TAG}"
          ssh_run "${DEPLOY_BASE_DIR}/remote-deploy.sh ${PREV_TAG}"
          ROLLBACK_STATUS=$?
          echo "::endgroup::"

          if [[ "${ROLLBACK_STATUS}" -eq 0 ]]; then
            echo "::error::Deploy of ${NEW_TAG} failed; automatically rolled back to previous known-good tag ${PREV_TAG} successfully. Failing this workflow so the bad deploy is still visible."
          else
            echo "::error::Deploy of ${NEW_TAG} failed AND rollback to ${PREV_TAG} also failed (exit ${ROLLBACK_STATUS}) — VM may be in a broken state, investigate manually."
          fi
          exit 1

      - name: Write deploy summary
        if: success()
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          TAG: staging-${{ steps.sha.outputs.short }}
        run: |
          COMMIT_SUBJECT="$(printf '%s' "${COMMIT_MESSAGE}" | head -n1 | sed 's/|/\\|/g')"
          {
            echo "## 🧪 Deployed to staging"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`${COMMIT_SHA:0:7}\`](${COMMIT_URL}) — ${COMMIT_SUBJECT} |"
            echo "| Image tag | \`${TAG}\` |"
            echo "| Time (UTC) | $(date -u +'%Y-%m-%d %H:%M:%S') |"
            echo "| VM | \`${{ vars.GCE_VM_NAME }}\` (\`${{ vars.GCE_VM_ZONE }}\`) |"
          } >> "$GITHUB_STEP_SUMMARY"
